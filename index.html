/* jewbuzz 2027 editorial design system */
:root{--ink:#111111;--muted:#6b6f7a;--line:#e9e9e9;--blue:#111111}
body{font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;color:#111111}
.top{height:82px;border-bottom:1px solid #eeeeee}
.content{max-width:1180px;padding-top:40px}
.welcome{max-width:780px;margin-bottom:32px}
.welcome .eyebrow{color:#70788e;font-size:10px;letter-spacing:2px}
.welcome h1{font-size:clamp(46px,7vw,82px);font-weight:500;letter-spacing:-.065em;line-height:1.01;margin:18px 0}
.welcome p{font-size:16px;line-height:1.65;color:#707070;max-width:490px}
.quick-nav{display:flex;gap:12px;overflow-x:auto;margin:34px 0 46px}
.quick-nav button{display:flex;align-items:center;gap:12px;min-width:150px;background:#f7f7f7;border:1px solid #f0f0f0;border-radius:12px;padding:16px 19px;font-weight:500;font-size:14px;color:#111111}
.quick-nav span{font-size:23px;font-weight:400}
.feature-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);background:#f5f5f5;border-radius:20px;overflow:hidden;min-height:480px}
.feature-media{background:#dfe2e8;display:flex;align-items:center;justify-content:center;padding:24px}
.feature-poster{position:relative;display:block;padding:0;border:0;background:#222;overflow:hidden;border-radius:13px;height:435px;aspect-ratio:9/16}
.feature-poster img{display:block;width:100%;height:100%;object-fit:cover}
.feature-play{position:absolute;bottom:17px;right:17px;background:white;border-radius:50%;height:48px;width:48px;display:grid;place-items:center;color:#111111}
.feature-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:clamp(28px,5vw,65px)}
.feature-copy .eyebrow{color:#777;letter-spacing:1.6px}
.feature-copy h2{font-size:clamp(32px,4.5vw,55px);font-weight:500;letter-spacing:-.055em;line-height:1.07;margin:22px 0}
.feature-copy p{font-size:15px;line-height:1.7;color:#737373;max-width:350px}
.dark-button{background:#111111;color:#fff;border:0;border-radius:100px;padding:16px 24px;font-size:14px;margin-top:22px}
.dark-button span{margin-left:35px}
.feature-counter{font-size:10px;letter-spacing:1.2px;color:#888;margin-top:45px}
.editorial-heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:66px 0 22px}
.editorial-heading h2{font-size:clamp(29px,4vw,43px);font-weight:500;letter-spacing:-.05em;margin:8px 0 0}
.editorial-heading .eyebrow{color:#858585;font-size:10px;letter-spacing:1.5px}
.editorial-heading button{border:0;background:none;font-size:12px;color:#111111;font-weight:600;white-space:nowrap;padding:0 0 5px}
.editorial-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.editorial-grid .poster img{aspect-ratio:9/16!important;object-fit:cover}
.editorial-grid .video .meta{margin-top:14px;font-size:10px}
.editorial-grid .video strong{font-size:15px;font-weight:500;line-height:1.4}
.meme-home{display:grid;grid-template-columns:1fr 1fr;background:#111111;color:white;border-radius:20px;overflow:hidden;margin-top:72px;min-height:380px}
.meme-home-copy{padding:clamp(30px,5vw,62px);display:flex;flex-direction:column;align-items:start;justify-content:center}
.meme-home .eyebrow{color:#c8d0e4}
.meme-home h2{font-size:clamp(35px,5vw,57px);font-weight:500;letter-spacing:-.055em;line-height:1.05;margin:20px 0}
.meme-home p{font-size:14px;line-height:1.7;color:#d0d5e3}
.meme-home button{border:1px solid #ffffff90;border-radius:100px;background:transparent;color:white;padding:14px 20px;margin-top:22px;font-size:13px}
.meme-home button span{margin-left:25px}
.meme-home-media{display:flex;align-items:center;justify-content:center;position:relative;background:#181818;overflow:hidden}
.meme-monogram{font-size:240px;line-height:1;font-weight:800;letter-spacing:-.12em;color:white;transform:rotate(-8deg)}
.meme-monogram span{color:#ffffff}
.meme-home-foot{position:absolute;bottom:23px;left:24px;font-size:11px;color:#e1e5f0}
.universe-editorial{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.universe-editorial a{background:#f5f5f5;border-radius:14px;padding:24px;min-height:160px;display:flex;flex-direction:column}
.universe-editorial small{font-size:11px;color:#777}
.universe-editorial strong{font-size:22px;font-weight:500;margin-top:12px}
.universe-editorial span{align-self:end;margin-top:auto;font-size:22px}
.event-grid .event{border-radius:15px}
.event-grid .event h3{font-weight:500}
.bottom button.active{color:#111111}
@media(max-width:750px){
.top{height:68px}
.content{padding:27px 18px 120px}
.welcome{margin-bottom:24px}
.welcome h1{font-size:clamp(43px,10vw,58px);letter-spacing:-.055em}
.welcome p{font-size:14px}
.quick-nav{margin:24px 0 30px;gap:8px}
.quick-nav button{min-width:115px;padding:12px 14px;font-size:12px;gap:8px}
.quick-nav span{font-size:20px}
.feature-layout{grid-template-columns:1fr;min-height:0}
.feature-media{padding:18px;background:#e8e9ed}
.feature-poster{height:min(80vh,490px);max-width:100%}
.feature-copy{padding:25px 25px 30px}
.feature-copy h2{font-size:31px;margin:10px 0}
.feature-copy p{font-size:13px}
.feature-counter{display:none}
.dark-button{margin-top:10px}
.editorial-heading{margin:45px 0 17px}
.editorial-heading h2{font-size:29px}
.editorial-heading button{font-size:11px}
.editorial-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.editorial-grid .video strong{font-size:13px}
.meme-home{grid-template-columns:1fr;margin-top:45px}
.meme-home-copy{padding:30px}
.meme-home h2{font-size:38px}
.meme-home-media{min-height:175px}
.meme-monogram{font-size:140px}
.universe-editorial{grid-template-columns:1fr 1fr}
.universe-editorial a{min-height:135px;padding:18px}
.universe-editorial strong{font-size:17px}
}

/* Culture Club: mobile-first visual discovery */
:root{--ink:#111827;--blue:#111111;--line:#edf0f3}

.club-cover-title{position:absolute;bottom:26px;left:19px;right:67px;color:white;font-size:clamp(22px,3.2vw,36px);font-weight:700;line-height:1.07;letter-spacing:-.8px}

.club-event-scroll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}

document.addEventListener('click',e=>{const b=e.target.closest('[data-save-reel]');if(!b)return;try{const id=b.dataset.saveReel;const k='jb-saved-reels';const a=JSON.parse(localStorage.getItem(k)||'[]');const next=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem(k,JSON.stringify(next));b.classList.toggle('is-saved',next.includes(id));b.textContent=next.includes(id)?'✓ Dans ma liste':'＋ Ma liste'}catch(err){console.warn(err)}});

document.getElementById('searchBtn').onclick=()=>{tab='Recherche';render()};let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});document.addEventListener('click',async e=>{if(e.target.id==='installApp'){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else{alert('Sur iPhone : Partager → Sur l’écran d’accueil. Sur Android : menu du navigateur → Installer l’application.')}}});if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>{if(navigator.serviceWorker.controller&&!sessionStorage.getItem('jb-cache-reset')){sessionStorage.setItem('jb-cache-reset','1');location.replace('/?fresh=1')}}).catch(()=>{});}
try{render()}catch(err){document.getElementById('main').innerHTML='<h1>jewbuzz</h1><p>Une erreur empêche certains contenus de s’afficher.</p><p style="font-size:12px">Code : '+String(err.message||err).replace(/[<>]/g,'')+'</p><a href="https://jewbuzz.com/">Site officiel</a>';console.error(err)}fetch('https://jewbuzz.com/wp-json/jewbuzz-play/v1/catalog',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Catalogue indisponible');return r.json()}).then(d=>{if(Array.isArray(d.videos)&&d.videos.length){const seen=new Set();videos=d.videos.filter(v=>/^[\w-]{11}$/.test(v.id)&&!seen.has(v.id)&&seen.add(v.id)).sort((a,b)=>(b.publishedAt||'').localeCompare(a.publishedAt||''));try{render()}catch(err){console.error(err)}}}).catch(()=>{});
