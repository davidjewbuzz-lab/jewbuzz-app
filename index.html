15px;text-align:center}.empty h3{font-size:22px;letter-spacing:-.7px}.empty p{max-width:430px;margin:12px auto 22px}.empty a{background:#111;color:white;border-radius:100px;padding:13px 20px;display:inline-block;font-size:13px;font-weight:750}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:45px;padding:13px 15px calc(13px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;min-width:56px;display:grid;justify-items:center;gap:5px;color:#777;font-size:11px;font-weight:600}.bottom button.active{color:#111;font-weight:850}.bottom svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.searchfield{width:100%;background:#f5f5f5;border:0;border-radius:14px;padding:17px 18px;font-size:17px;outline:none;margin:10px 0 25px}.prefs{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:19px 0}.overlay{position:fixed;inset:0;background:#000e;z-index:50;display:grid;place-content:center;padding:12px}.overlay button{color:white;background:none;border:0;font-size:28px;justify-self:end;padding:12px}.overlay iframe{width:min(95vw,950px);aspect-ratio:16/9;border:0}

<header class="top shell"><a href="/" aria-label="jewbuzz, accueil"><img src="https://jewbuzz.com/wp-content/uploads/jewbuzz/assets/Logo_jewbuzz_blue.svg" alt="jewbuzz" style="height:39px;max-width:155px;object-fit:contain"></a><div class="top-actions"><button class="iconbtn" id="searchBtn" aria-label="Recherche">⌕</button><button class="iconbtn" id="notifyBtn" aria-label="Notifications">♧</button></div></header>

<script>
const raw=[['uNe2JYnPclM','LIOR RAZ | L’interview jewbuzz','Interviews','2026-11-07'],['r8k2CaieIiI','Cette vidéo peut t’aider à sauver des vies !','Reportage','2026-11-01'],['bmuPVI5iJ6Y','Une Française parmi les meilleurs enseignants du monde','Découverte','2026-10-22'],['sLjS-RqCjuM','J’ai participé à la Star Academy 2 !','Story Time','2026-10-21'],['AnZtZ3B1j3w','Norbert, le roi de la darbouka !','Humour','2026-10-14'],['uW9in29TUmg','Si elle devine le juste prix, on lui offre tout !','Humour','2026-10-13'],['MEFE5z7k0tw','David Azria se fait passer pour un mec de la PAC','Humour','2026-10-12']];
let videos=raw.map(v=>({id:v[0],title:v[1],category:v[2],publishedAt:v[3]})),tab='Accueil',filter='Tout';
const events=[{date:'15 NOVEMBRE 2026',title:'Journée Portes Ouvertes',place:'Université hébraïque de Jérusalem · En ligne',img:'https://jewbuzz.com/wp-content/uploads/2026/11/Digital-Open-Day-–-Universite-Hebraique-de-Jerusalem.jpg',url:'https://tinyurl.com/52jepup6'},{date:'6 DÉCEMBRE 2026',title:'Les Lumières de l’espoir avec Enrico Macias',place:'Grande Synagogue de la Victoire · Paris',img:'https://jewbuzz.com/wp-content/uploads/2026/11/Les-Lumieres-de-lespoir-–-Enrico-Macias.jpg',url:'https://www.billetweb.fr/les-lumieres-de-lespoir'},{date:'21 DÉCEMBRE 2026',title:'Concert NEXT',place:'Plénitude Arena · Paris',img:'https://img.mako.co.il/2026/08/04/next2026_autoOrient_w.jpg'}];
const icons={Accueil:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',Vidéos:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/>',Mèmes:'<circle cx="12" cy="12" r="9"/><path d="M8 14q4 5 8 0M8 9h.01M16 9h.01"/>',Agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',Plus:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poster=v=>v.poster||'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg';
const card=v=>'<button class="video" data-video="'+v.id+'"><div class="poster"><img loading="lazy" src="'+esc(poster(v))+'" alt="'+esc(v.title)+'"><span class="play">▶</span></div><div class="meta">'+esc(v.category||'Vidéo')+'</div><strong>'+esc(v.title)+'</strong></button>';
const section=(name,items,target='Vidéos')=>'<div class="heading"><h2>'+name+'</h2><button data-tab="'+target+'">Voir tout ↗</button></div><div class="video-grid">'+items.map(card).join('')+'</div>';
const eventCard=e=>'<article class="event"><img loading="lazy" src="'+esc(e.img)+'" alt="'+esc(e.title)+'"><div class="event-body"><div class="eyebrow">'+e.date+'</div><h3>'+esc(e.title)+'</h3><p>'+esc(e.place)+'</p>'+(e.url?'<a target="_blank" rel="noopener" href="'+e.url+'">Réserver ↗</a>':'<span style="font-size:12px;color:#777">Billetterie à venir</span>')+'</div></article>';
const tabs=['Accueil','Vidéos','Mèmes','Agenda','Plus'];
function render(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'"><svg viewBox="0 0 24 24">'+icons[t]+'</svg>'+t+'</button>').join('');const m=document.getElementById('main');
if(tab==='Accueil'){const v=videos[0];m.innerHTML='<div class="eyebrow">L’application officielle</div><h1 class="title">Tout jewbuzz.<br>Dans ta poche.</h1><p class="subtitle">Les vidéos qui font parler, les moments qui rassemblent, les événements à ne pas manquer.</p><div class="chips">'+['À la une','Vidéos','Humour','Événements'].map((x,i)=>'<button class="chip '+(i===0?'active':'')+'" data-home="'+x+'">'+x+'</button>').join('')+'</div><div class="hero"><img src="'+esc(poster(v))+'" alt="'+esc(v.title)+'"><div class="hero-copy"><div class="eyebrow">À la une · jewbuzz</div><h2>'+esc(v.title)+'</h2><button class="watch" data-video="'+v.id+'">▶ Regarder maintenant</button></div></div>'+section('Tout juste publié',videos.slice(0,6))+section('À ne pas manquer',videos.filter(v=>v.id!==videos[0].id).slice(3,9))+'<div class="heading"><h2>À l’agenda</h2><button data-tab="Agenda">Voir tout ↗</button></div><div class="event-grid">'+events.map(eventCard).join('')+'</div>'}
else if(tab==='Vidéos'){const cats=['Tout','Interviews','Story Time','Outside','Inside','Chrono','Business','Humour','À découvrir'];m.innerHTML='<div class="eyebrow">Le catalogue</div><h1 class="title">À regarder.</h1><p class="subtitle">Tous les formats jewbuzz, sans détour.</p><div class="chips">'+cats.map(c=>'<button class="chip '+(filter===c?'active':'')+'" data-filter="'+c+'">'+c+'</button>').join('')+'</div><div class="video-grid">'+videos.filter(v=>filter==='Tout'||v.category===filter).map(card).join('')+'</div>'}
else if(tab==='Mèmes')m.innerHTML='<div class="eyebrow">À partager</div><h1 class="title">Les mèmes.</h1><p class="subtitle">L’humour de la communauté, au quotidien.</p><div class="empty"><h3>Le fil Instagram arrive ici.</h3><p>Nous affichons uniquement les publications authentiques. La connexion au compte officiel Meta reste à activer.</p><a href="https://www.instagram.com/jewbuzz/" target="_blank" rel="noopener">Voir les publications ↗</a></div>';
else if(tab==='Agenda')m.innerHTML='<div class="eyebrow">À venir</div><h1 class="title">On se retrouve où ?</h1><p class="subtitle">Les prochains événements publiés par jewbuzz.</p><div class="event-grid">'+events.map(eventCard).join('')+'</div>';
else if(tab==='Plus')m.innerHTML='<div class="eyebrow">Explorer</div><h1 class="title">L’univers jewbuzz.</h1><p class="subtitle">Une communauté, plusieurs univers.</p><div class="universes">'+[['jewbuzz Love','https://jewbuzz.com/love/'],['Concours','https://jewbuzz.com/'],['jewbuzz+','https://jewbuzz.com/'],['Shop','https://jewbuzz.shop/'],['Real Estate','https://jewbuzz-realestate.com/'],['Impact','https://jewbuzz.com/']].map(x=>'<a class="universe" target="_blank" rel="noopener" href="'+x[1]+'"><strong>'+x[0]+'</strong><span>↗</span></a>').join('')+'</div>';
else if(tab==='Recherche')m.innerHTML='<div class="eyebrow">Explorer</div><h1 class="title">Rechercher.</h1><input class="searchfield" id="query" autofocus placeholder="Vidéo, invité, format…"><div id="results" class="video-grid"></div>';
else if(tab==='Notifications')m.innerHTML='<div class="eyebrow">Personnalisation</div><h1 class="title">Notifications.</h1><p class="subtitle">Choisis les actualités qui t’intéressent.</p>'+['Vidéos','Mèmes','Événements','Concours'].map(x=>'<label class="prefs">'+x+'<input type="checkbox" data-pref="'+x+'" '+(localStorage.getItem('jb-pref-'+x)==='true'?'checked':'')+'></label>').join('')+'<p style="font-size:12px">Les préférences sont enregistrées localement. Les notifications push ne sont pas encore actives.</p>';
if(tab==='Recherche')document.getElementById('query').oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById('results').innerHTML=q?videos.filter(v=>(v.title+' '+v.category).toLowerCase().includes(q)).map(card).join(''):''}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-video],[data-filter],[data-home]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0)}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.home){const x=b.dataset.home;if(x==='Vidéos'){tab='Vidéos';render()}else if(x==='Humour'){tab='Vidéos';filter='Humour';render()}else if(x==='Événements'){tab='Agenda';render()}scrollTo(0,0)}if(b.dataset.video){const o=document.createElement('div');o.className='overlay';o.innerHTML='<button aria-label="Fermer">✕</button><iframe allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+b.dataset.video+'?autoplay=1"></iframe>';o.querySelector('button').onclick=()=>o.remove();document.body.appendChild(o)}});
document.addEventListener('change',e=>{if(e.target.dataset.pref)localStorage.setItem('jb-pref-'+e.target.dataset.pref,String(e.target.checked))});
document.getElementById('searchBtn').onclick=()=>{tab='Recherche';render()};document.getElementById('notifyBtn').onclick=()=>{tab='Notifications';render()};
render();fetch('https://jewbuzz.com/wp-json/jewbuzz-play/v1/catalog').then(r=>r.json()).then(d=>{if(Array.isArray(d.videos)&&d.videos.length){const seen=new Set();videos=d.videos.filter(v=>/^[\w-]{11}$/.test(v.id)&&!seen.has(v.id)&&seen.add(v.id)).sort((a,b)=>(b.publishedAt||'').localeCompare(a.publishedAt||''));render()}}).catch(()=>{});
</script></body></html>
