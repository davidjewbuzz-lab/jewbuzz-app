<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>jewbuzz — Application</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#171b23;background:white}header{display:flex;align-items:center;justify-content:space-between;padding:18px;position:sticky;top:0;background:white;border-bottom:1px solid #eee;z-index:3}header img{max-width:150px;max-height:42px}header button{border:0;background:none;font-size:24px}main{max-width:750px;margin:auto;padding:18px 16px 110px;min-height:80vh}h1{font-size:26px}h2{font-size:20px;margin:28px 0 13px}p{color:#667085;line-height:1.5}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e8ef;display:flex;justify-content:space-around;padding:12px 0 18px;z-index:4}nav button{border:0;background:none;color:#737e90;display:grid;justify-items:center;gap:5px;font-size:11px}nav button.active{color:#0873df;font-weight:bold}nav b{font-size:24px;font-weight:400}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:none;border:0;text-align:left;padding:0;min-width:0}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#eee}.card small,.tag{display:block;color:#0873df;font-weight:bold;font-size:11px;margin:6px 0}.card strong{font-size:13px;line-height:1.35;display:block}.hero{border-radius:18px;overflow:hidden;background:#f3f5f9}.hero img{width:100%;aspect-ratio:16/9;object-fit:cover}.hero .body{padding:17px}.hero h1{margin:8px 0}.primary{border:0;background:#0873df;color:#fff;padding:12px 20px;border-radius:10px;font-weight:bold}.row{display:flex;align-items:center;justify-content:space-between}.row button{border:0;background:none;color:#0873df;font-weight:bold}.filters{display:flex;gap:8px;overflow-x:auto;margin:18px 0}.filters button{white-space:nowrap;border:0;background:#f0f3f8;border-radius:30px;padding:9px 14px}.filters button.active{background:#0873df;color:#fff}.event{border:1px solid #e7e9ee;border-radius:14px;overflow:hidden;margin-bottom:16px}.event img{width:100%;height:230px;object-fit:contain;background:#f5f6fa}.event .body{padding:15px}.event a{color:#0873df;font-weight:bold}.empty{background:#f3f5f9;border-radius:14px;padding:24px;text-align:center}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tiles a{background:#f3f5f9;border-radius:14px;padding:24px 16px;color:#171b23;text-decoration:none;font-weight:bold}.tiles span{display:block;color:#0873df;font-size:26px;margin-bottom:12px}.modal{position:fixed;inset:0;background:#000e;display:grid;place-content:center;z-index:10;padding:10px}.modal iframe{width:min(96vw,850px);aspect-ratio:16/9;border:0}.modal button{background:none;color:white;border:0;font-size:26px;justify-self:end}</style></head><body><header><img src="https://jewbuzz.com/wp-content/uploads/jewbuzz/assets/Logo_jewbuzz_blue.svg" onerror="this.outerHTML='<strong>jewbuzz</strong>'" alt="jewbuzz"><div><button id="search" aria-label="Recherche">⌕</button><button id="bell" aria-label="Notifications">♧</button></div></header><main id="main"></main><nav id="nav"></nav><script>
const fallback=[['uNe2JYnPclM','Lior Raz | L’interview jewbuzz','Interviews','2026-11-07'],['r8k2CaieIiI','Cette vidéo peut t’aider à sauver des vies !','Reportage','2026-11-01'],['bmuPVI5iJ6Y','Une Française parmi les meilleurs enseignants du monde','Découverte','2026-10-22'],['sLjS-RqCjuM','J’ai participé à la Star Academy 2 !','Story Time','2026-10-21'],['AnZtZ3B1j3w','Norbert, le roi de la darbouka !','Humour','2026-10-14'],['uW9in29TUmg','Si elle devine le juste prix, on lui offre tout !','Humour','2026-10-13'],['MEFE5z7k0tw','David Azria se fait passer pour un mec de la PAC','Humour','2026-10-12']];
let videos=fallback.map(x=>({id:x[0],title:x[1],category:x[2],publishedAt:x[3]})),tab='Accueil',filter='Toutes';
const events=[{date:'15 novembre 2026',title:'Journée Portes Ouvertes',place:'Université hébraïque de Jérusalem · En ligne',img:'https://jewbuzz.com/wp-content/uploads/2026/11/Digital-Open-Day-–-Universite-Hebraique-de-Jerusalem.jpg',url:'https://tinyurl.com/52jepup6'},{date:'6 décembre 2026',title:'Les Lumières de l’espoir avec Enrico Macias',place:'Grande Synagogue de la Victoire · Paris',img:'https://jewbuzz.com/wp-content/uploads/2026/11/Les-Lumieres-de-lespoir-–-Enrico-Macias.jpg',url:'https://www.billetweb.fr/les-lumieres-de-lespoir'},{date:'21 décembre 2026',title:'Concert NEXT',place:'Plénitude Arena · Paris',img:'https://img.mako.co.il/2026/08/04/next2026_autoOrient_w.jpg'}];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const pic=v=>v.poster||'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg';
const card=v=>'<button class="card" data-video="'+v.id+'"><img loading="lazy" src="'+esc(pic(v))+'" alt="'+esc(v.title)+'"><small>'+esc(v.category||'Vidéo')+'</small><strong>'+esc(v.title)+'</strong></button>';
const section=(title,arr)=>'<div class="row"><h2>'+title+'</h2><button data-tab="Vidéos">Tout voir ›</button></div><div class="grid">'+arr.map(card).join('')+'</div>';
const eventCard=e=>'<article class="event"><img loading="lazy" src="'+esc(e.img)+'" alt="'+esc(e.title)+'"><div class="body"><span class="tag">'+e.date+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.place)+'</p>'+(e.url?'<a href="'+e.url+'" target="_blank" rel="noopener">Réserver ↗</a>':'Billetterie à venir')+'</div></article>';
function render(){document.getElementById('nav').innerHTML=['Accueil','Vidéos','Mèmes','Agenda','Plus'].map((t,i)=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'"><b>'+['⌂','▷','☺','▦','☷'][i]+'</b>'+t+'</button>').join('');const m=document.getElementById('main');
if(tab==='Accueil')m.innerHTML='<div class="hero"><img src="'+esc(pic(videos[0]))+'"><div class="body"><span class="tag">À LA UNE</span><h1>'+esc(videos[0].title)+'</h1><button class="primary" data-video="'+videos[0].id+'">▶ Regarder</button></div></div>'+section('Dernières vidéos',videos.slice(0,6))+section('Humour & divertissement',videos.filter(v=>/humour|darbouka|prix|pac/i.test((v.category||'')+' '+v.title)).slice(0,4))+'<div class="row"><h2>Prochains événements</h2><button data-tab="Agenda">Agenda ›</button></div>'+events.slice(0,2).map(eventCard).join('');
else if(tab==='Vidéos'){let cats=['Toutes','Interviews','Story Time','Outside','Inside','Chrono','Business','Humour'];m.innerHTML='<h1>Vidéos</h1><p>Les dernières publications officielles jewbuzz.</p><div class="filters">'+cats.map(c=>'<button data-filter="'+c+'" class="'+(filter===c?'active':'')+'">'+c+'</button>').join('')+'</div><div class="grid">'+videos.filter(v=>filter==='Toutes'||v.category===filter).map(card).join('')+'</div>'}
else if(tab==='Mèmes')m.innerHTML='<h1>Mèmes</h1><div class="empty"><h3>Publications Instagram</h3><p>La connexion au flux Meta est nécessaire pour afficher automatiquement les vrais mèmes.</p><a href="https://www.instagram.com/jewbuzz/" target="_blank">Voir le compte officiel ↗</a></div>';
else if(tab==='Agenda')m.innerHTML='<h1>Agenda</h1><p>Événements publiés sur jewbuzz.com.</p>'+events.map(eventCard).join('');
else if(tab==='Plus')m.innerHTML='<h1>L’univers jewbuzz</h1><div class="tiles">'+[['♡','jewbuzz Love','https://jewbuzz.com/love/'],['♧','Concours','https://jewbuzz.com/'],['%','jewbuzz+','https://jewbuzz.com/'],['▣','Shop','https://jewbuzz.shop/'],['⌂','Real Estate','https://jewbuzz-realestate.com/'],['✦','Impact','https://jewbuzz.com/']].map(x=>'<a href="'+x[2]+'"><span>'+x[0]+'</span>'+x[1]+' ↗</a>').join('')+'</div>';
else if(tab==='Recherche')m.innerHTML='<h1>Recherche</h1><input id="q" placeholder="Rechercher une vidéo…" style="padding:14px;width:100%;background:#f2f4f8;border:0;border-radius:12px"><div id="results" class="grid" style="margin-top:20px"></div>';
else if(tab==='Notifications')m.innerHTML='<h1>Notifications</h1>'+['Vidéos','Mèmes','Événements','Concours'].map(x=>'<label class="row" style="padding:16px;background:#f3f5f9;margin-bottom:8px">'+x+'<input type="checkbox" data-pref="'+x+'" '+(localStorage.getItem('jewbuzz-'+x)==='true'?'checked':'')+'></label>').join('')+'<p>Préférences locales. Les notifications push ne sont pas encore activées.</p>';
if(tab==='Recherche')document.getElementById('q').oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById('results').innerHTML=videos.filter(v=>q&&(v.title+' '+v.category).toLowerCase().includes(q)).map(card).join('')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-video],[data-filter]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0)}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.video){let overlay=document.createElement('div');overlay.className='modal';overlay.innerHTML='<button>✕</button><iframe allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+b.dataset.video+'?autoplay=1"></iframe>';overlay.querySelector('button').onclick=()=>overlay.remove();document.body.appendChild(overlay)}});
document.addEventListener('change',e=>{if(e.target.dataset.pref)localStorage.setItem('jewbuzz-'+e.target.dataset.pref,String(e.target.checked))});
document.getElementById('search').onclick=()=>{tab='Recherche';render()};document.getElementById('bell').onclick=()=>{tab='Notifications';render()};
render();fetch('https://jewbuzz.com/wp-json/jewbuzz-play/v1/catalog').then(r=>r.json()).then(d=>{if(Array.isArray(d.videos)&&d.videos.length){const seen=new Set();videos=d.videos.filter(v=>/^[\w-]{11}$/.test(v.id)&&!seen.has(v.id)&&seen.add(v.id)).sort((a,b)=>(b.publishedAt||'').localeCompare(a.publishedAt||''));render()}}).catch(()=>{});
</script></body></html>
